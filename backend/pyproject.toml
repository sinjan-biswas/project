[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sinjan-biswas", email = "sinjanbiswas1024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmrz>=2.1.2",
    "insightface>=2.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.29.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
