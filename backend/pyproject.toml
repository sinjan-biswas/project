[project]
name = "backend"
version = "0.1.0"
description = "AI Border Screening API"
readme = "README.md"
authors = [
    { name = "sinjan-biswas", email = "sinjanbiswas1024@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "grad-cam>=1.5.7",
    "insightface>=2.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.29.0",
    "opencv-python-headless>=5.0.0.93",
    # --- Paddle pins: fix the OneDNN PIR crash, survive `uv run` ---
    "paddlepaddle==2.6.2",
    "paddleocr>=2.7,<3",
    "paddlex>=3.0,<3.2",
    # ----------------------------------------------------------------
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "transformers>=4.35.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

# ----- uv configuration (single block, no duplicates) -----
[tool.uv]
package = false

# Only resolve for Linux x86_64. Skips the Windows-only protobuf
# conflict between paddlepaddle==2.6.2 and onnxruntime>=1.29.0.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "extra == 'train'" }]
torchvision = [{ index = "pytorch-cu128", marker = "extra == 'train'" }]